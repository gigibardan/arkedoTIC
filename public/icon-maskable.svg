<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable (Android circles/squircles) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Centered contents scaled within 80% safe zone (center at 256, 256, scaled ~0.76) -->
  <g transform="translate(256,256) scale(0.76) translate(-256,-240)">
    <!-- Rocket Body & Wings -->
    <g transform="translate(256,236) rotate(-45)">
      <!-- Exhaust flame -->
      <path d="M -16,90 Q 0,160 0,175 Q 0,160 16,90 Z" fill="url(#flameGrad)" />
      <path d="M -8,90 Q 0,135 0,145 Q 0,135 8,90 Z" fill="#ffffff" opacity="0.9" />

      <!-- Left fin -->
      <path d="M -30,45 L -75,95 L -32,85 Z" fill="#4338ca" />
      <!-- Right fin -->
      <path d="M 30,45 L 75,95 L 32,85 Z" fill="#4338ca" />

      <!-- Rocket fuselage -->
      <path d="M 0,-115 C 55,-40 50,70 34,92 L -34,92 C -50,70 -55,-40 0,-115 Z" fill="url(#rocketGrad)" />

      <!-- Porthole / Computer Screen -->
      <circle cx="0" cy="-10" r="34" fill="#0f172a" stroke="#e0e7ff" stroke-width="6" />
      <circle cx="0" cy="-10" r="26" fill="url(#screenGrad)" />
      
      <!-- Code prompt </> inside screen -->
      <path d="M -14,-10 L -8,-16 M -14,-10 L -8,-4" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 14,-10 L 8,-16 M 14,-10 L 8,-4" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="-3" y1="-3" x2="3" y2="-17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

      <!-- Rocket Nose tip accent -->
      <path d="M 0,-115 C 18,-85 24,-65 24,-65 L -24,-65 C -24,-65 -18,-85 0,-115 Z" fill="#38bdf8" opacity="0.85" />
    </g>

    <!-- Sparkles -->
    <path d="M 140,160 L 145,175 L 160,180 L 145,185 L 140,200 L 135,185 L 120,180 L 135,175 Z" fill="#38bdf8" opacity="0.85" />
    <path d="M 370,140 L 374,152 L 386,156 L 374,160 L 370,172 L 366,160 L 354,156 L 366,152 Z" fill="#fbbf24" opacity="0.9" />

    <!-- Label -->
    <rect x="136" y="415" width="240" height="42" rx="21" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <text x="256" y="443" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="3">ARKEDU TIC</text>
  </g>
</svg>

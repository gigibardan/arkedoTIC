[build]
  publish = "dist"
  command = "npm run build"

# Redirect de la vechiul domeniu Netlify la cel oficial de productie (cu fortare 301!)
[[redirects]]
  from = "https://arkedotic.netlify.app/*"
  to = "https://www.arkyedu.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://arkedotic.netlify.app/*"
  to = "https://www.arkyedu.com/:splat"
  status = 301
  force = true

# Redirect de la apex domain la www
[[redirects]]
  from = "https://arkyedu.com/*"
  to = "https://www.arkyedu.com/:splat"
  status = 301

[[redirects]]
  from = "http://arkyedu.com/*"
  to = "https://www.arkyedu.com/:splat"
  status = 301

# SPA Fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Aggressive immutable caching for hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML entry points - always revalidate and explicitly declare UTF-8 charset
[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

